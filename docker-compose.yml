services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: duolan
      POSTGRES_PASSWORD: duolan_local
      POSTGRES_DB: duolan
    ports:
      - '5433:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/initdb:/docker-entrypoint-initdb.d
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U duolan -d duolan']
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    profiles: ['app']
    build:
      context: .
      dockerfile: Dockerfile.api.dev
    environment:
      PORT: 3000
      NODE_ENV: development
      GAME_SERVER: LAN
      CORS_ORIGIN: http://localhost:4200
      APP_URL: http://localhost:4200
      DB_URI: postgresql://duolan:duolan_local@postgres:5432/duolan
      SECRET_JWT_SEED: dev_duolan_secret_0123456789abcdef0123456789abcdef
      JWT_EXPIRE_IN: 1d
      SUPPORT_EMAIL: soporte@duolan.online
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-mailto:soporte@duolan.online}
      RIOT_API_KEY: ${RIOT_API_KEY:-}
      RIOT_PLATFORM: ${RIOT_PLATFORM:-la1}
      RIOT_REGION: ${RIOT_REGION:-americas}
      RIOT_API_TIMEOUT_MS: ${RIOT_API_TIMEOUT_MS:-8000}
      RATE_LIMIT_WINDOW_MS: 900000
      RATE_LIMIT_MAX: 100
      LOG_LEVEL: info
    ports:
      - '3000:3000'
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./apps/api/src:/app/apps/api/src
      - ./apps/api/migrations:/app/apps/api/migrations
      - ./apps/api/seeders:/app/apps/api/seeders
      - ./packages/shared/src:/app/packages/shared/src
    working_dir: /app/apps/api
    command: node --watch src/index.js

  web:
    profiles: ['app']
    build:
      context: .
      dockerfile: Dockerfile.web.dev
    environment:
      CHOKIDAR_USEPOLLING: 'true'
    ports:
      - '4200:4200'
    depends_on:
      - api
    volumes:
      - ./apps/web/src:/app/apps/web/src
      - ./apps/web/public:/app/apps/web/public
      - ./apps/web/angular.json:/app/apps/web/angular.json
      - ./packages/shared/src:/app/packages/shared/src
    working_dir: /app/apps/web
    command: npm start -- --host 0.0.0.0 --port 4200 --proxy-config proxy.docker.conf.json

volumes:
  postgres_data:
